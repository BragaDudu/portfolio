<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alertas — HelpDesk & Monitoring</title>
    <!-- ★ GUARDA DE SESSAO -- roda ANTES de tudo.
         Sem token, redireciona para o login imediatamente. Se esperasse o
         DOMContentLoaded, a tela apareceria vazia e dispararia quatro
         erros 401 antes de redirecionar. -->
    <script src="js/demo-api.js?v=1"></script>
    <script src="js/auth.js?v=11"></script>
    <script>if (!auth.exigirLogin()) { throw new Error("redirecionando"); }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="stylesheet" href="css/style.css?v=11" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar__brand">Help<span>Desk</span></div>
        <nav class="sidebar__nav">
          <a href="index.html" data-page="index.html"><span class="icon">▤</span> Dashboard</a>
          <a href="clientes.html" data-page="clientes.html"><span class="icon">◍</span> Clientes</a>
          <a href="chamados.html" data-page="chamados.html"><span class="icon">✉</span> Chamados</a>
          <a href="equipamentos.html" data-page="equipamentos.html"><span class="icon">▣</span> Equipamentos</a>
          <a href="alertas.html" data-page="alertas.html"><span class="icon">⚠</span> Alertas</a>
        </nav>
        <!-- preenchido por ui.js -> montarSessao() -->
        <div class="sidebar__foot"></div>
      </aside>

      <main class="content">
        <div class="page-header">
          <div>
            <h1>Alertas</h1>
            <p>Gerados automaticamente pelo backend quando a temperatura passa do limite.</p>
          </div>
        </div>

        <!-- Painel de anomalias: diagnóstico do momento -->
        <div class="panel">
          <div class="panel__head"><h2>Situações anormais (diagnóstico atual)</h2></div>
          <div class="panel__body" id="anomalies"><div class="state state--loading">Carregando...</div></div>
        </div>

        <div class="panel">
          <div class="panel__head">
            <h2>Histórico de alertas</h2>
            <div class="filters">
              <div class="field">
                <label for="f-alert-status">Status</label>
                <select id="f-alert-status">
                  <option value="">Todos</option>
                  <option value="ABERTO">Aberto</option>
                  <option value="RECONHECIDO">Reconhecido</option>
                  <option value="RESOLVIDO">Resolvido</option>
                </select>
              </div>
            </div>
          </div>
          <div class="panel__body panel__body--flush">
            <div id="alerts-table"><div class="state state--loading">Carregando...</div></div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/api.js?v=11"></script>
    <script src="js/ui.js?v=11"></script>
    <script src="js/alertas.js?v=11"></script>
  </body>
</html>
